[package]
name = "dispatch-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Find a local agent session and deliver a message into it"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
anyhow = "1"
dirs = "6"
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
regex = "1"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
sys-locale = "0.3"
snow = "0.10"
mdns-sd = "0.21"
hmac = "0.12"
iroh = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
base64 = "0.22"
url = "2"
ruzstd = "0.9.1"
# Grok Bot: the app's stored sign-in (Electron safeStorage) and its backend over HTTPS. reqwest
# and rustls are already in the tree through iroh; the same provider (ring) is used here.
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "blocking", "json", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[package]
name = "dispatch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Find an agent session on this machine and deliver a message into it"
default-run = "dispatch"

[[bin]]
name = "dispatch"
path = "src/main.rs"

[dependencies]
dispatch-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde_json = "1"
